<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>%VITE_APP_NAME% Privacy Policy</title>
    <meta
      name="description"
      content="Privacy policy for %VITE_APP_NAME%, a music and video player for Android with on-device AI playlists. Your files and listening data stay on your device."
    />
    <meta name="theme-color" content="#12131A" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/jost-latin.woff" as="font" type="font/woff" crossorigin />

    <!-- Applies the saved theme before first paint so there is no light/dark flash -->
    <script>
      try {
        var saved = localStorage.getItem('sonivex-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        This page needs JavaScript. The privacy policy is also available from the Sonivex app (Settings →
        Privacy policy).
      </p>
    </noscript>
    <script type="module" src="/src/privacy-main.ts"></script>
  </body>
</html>
